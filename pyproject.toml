[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playcore"
version = "1.1.0"
description = "Inventario e instalación bajo demanda para SteamOS y Bazzite"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
playcore = "playcore.__main__:main"

[tool.setuptools.packages.find]
include = ["playcore*"]
